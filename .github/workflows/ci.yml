name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/stage1-observatory-import
      - feat/observatory-national-product-experience
      - feat/national-source-readiness-and-inec-pilot
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Registry · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm install
      - name: Generate CI dependency lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Upload generated lockfile for repository pinning
        uses: actions/upload-artifact@v4
        with:
          name: generated-npm-lockfile
          path: package-lock.json
          if-no-files-found: error
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Validate source registry
        run: npm run validate:registry

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build
